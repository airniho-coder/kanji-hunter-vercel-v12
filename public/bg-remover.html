<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景除去ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
  :root { --bg:#0a0a0f; --surface:#13131a; --border:#2a2a3a; --gold:#c9a84c; --text:#e8e4d8; --muted:#666680; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Serif JP',serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px; }
  h1 { font-size:22px; font-weight:900; letter-spacing:4px; color:var(--gold); margin-bottom:4px; }
  .subtitle { font-size:10px; letter-spacing:3px; color:var(--muted); margin-bottom:32px; text-transform:uppercase; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:480px; margin-bottom:16px; }
  .card-title { font-size:10px; letter-spacing:3px; color:var(--gold); margin-bottom:16px; text-transform:uppercase; }

  /* アップロード */
  #drop-zone { border:2px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; transition:all .2s; position:relative; }
  #drop-zone:hover, #drop-zone.dragover { border-color:var(--gold); background:rgba(201,168,76,.05); }
  #drop-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop-icon { font-size:40px; margin-bottom:12px; }
  .drop-text { font-size:13px; color:var(--muted); line-height:1.8; }

  /* モード切替 */
  .mode-row { display:flex; gap:8px; margin-bottom:14px; }
  .mode-btn { flex:1; padding:9px; border-radius:8px; font-size:11px; font-family:'Noto Serif JP',serif; letter-spacing:1px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); transition:all .15s; }
  .mode-btn.active { background:rgba(201,168,76,.15); border-color:var(--gold); color:var(--gold); }

  /* キャンバスエリア */
  #canvas-area { display:none; margin-bottom:16px; }
  .canvas-hint { font-size:10px; color:var(--muted); background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.2); border-radius:8px; padding:8px 12px; margin-bottom:10px; line-height:1.7; }
  #main-canvas-wrap { position:relative; border-radius:10px; overflow:hidden; border:2px solid rgba(201,168,76,.3); transition:border-color .2s; }
  #main-canvas-wrap.active-mode { border-color:var(--gold); box-shadow:0 0 16px rgba(201,168,76,.2); }
  #main-canvas { display:block; width:100%; height:auto; touch-action:none; user-select:none; }
  /* 選択矩形 */
  #sel-rect { position:absolute; border:2px dashed #FFD700; background:rgba(255,215,0,.08); pointer-events:none; display:none; }
  /* crosshair */
  #crosshair { position:absolute; pointer-events:none; display:none; width:20px; height:20px; transform:translate(-50%,-50%); }
  #crosshair::before { content:''; position:absolute; width:1px; height:20px; background:#fff; left:50%; top:0; box-shadow:0 0 2px #000; }
  #crosshair::after  { content:''; position:absolute; height:1px; width:20px; background:#fff; top:50%; left:0; box-shadow:0 0 2px #000; }
  #picked-dot { position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.5); display:none; }

  /* 選択範囲ボタン */
  #sel-actions { display:none; flex-direction:column; gap:8px; margin-bottom:12px; }
  .sel-btn { padding:9px; border-radius:8px; font-size:11px; font-family:'Noto Serif JP',serif; letter-spacing:1px; cursor:pointer; border:1px solid; transition:all .15s; width:100%; }
  #sel-clear-btn { border-color:var(--border); background:transparent; color:var(--muted); }
  #sel-apply-btn { border-color:rgba(201,168,76,.5); background:rgba(201,168,76,.12); color:var(--gold); }

  /* 色・許容範囲 */
  .color-row { display:flex; align-items:center; gap:10px; margin:0 0 14px; }
  .color-label { font-size:11px; color:var(--muted); letter-spacing:1px; white-space:nowrap; }
  #bg-color { width:40px; height:40px; border:2px solid var(--border); border-radius:8px; cursor:pointer; background:none; padding:2px; flex-shrink:0; }
  #color-preview { flex:1; height:32px; border-radius:8px; border:1px solid var(--border); background:#c0c0c0; transition:background .15s; }
  #color-hex { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); min-width:56px; }
  .tol-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  #tolerance { flex:1; accent-color:var(--gold); }
  #tolerance-val { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); min-width:26px; text-align:right; }

  #run-btn { width:100%; padding:14px; background:linear-gradient(135deg,#c9a84c,#e8c97a); border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:'Noto Serif JP',serif; color:#0a0a0f; cursor:pointer; letter-spacing:3px; transition:opacity .15s; }
  #run-btn:hover { opacity:.85; }
  #run-btn:disabled { opacity:.4; cursor:not-allowed; }

  /* プレビュー */
  .preview-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .preview-box { border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; position:relative; }
  .checker { background-image:linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; background-color:#111; }
  .preview-label { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:2px; color:var(--muted); background:rgba(0,0,0,.7); padding:2px 8px; border-radius:4px; white-space:nowrap; }
  .preview-box img { width:100%; height:100%; object-fit:contain; }
  .elem-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .elem-btn { padding:5px 10px; border-radius:6px; font-size:10px; cursor:pointer; border:1px solid transparent; font-family:'Noto Serif JP',serif; letter-spacing:1px; transition:all .15s; opacity:.6; background:transparent; }
  .elem-btn.active { opacity:1; border-color:currentColor; }
  #dl-btn { width:100%; padding:12px; background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.4); border-radius:10px; font-size:13px; font-weight:700; font-family:'Noto Serif JP',serif; color:var(--gold); cursor:pointer; letter-spacing:2px; transition:all .15s; display:none; }
  #dl-btn:hover { background:rgba(201,168,76,.2); }
  canvas#work-canvas { display:none; }

  .range-info { font-size:10px; color:rgba(201,168,76,.7); margin-top:6px; letter-spacing:1px; display:none; }
</style>
</head>
<body>

<h1>⚗ 背景除去</h1>
<p class="subtitle">単色背景 → 透過PNG変換ツール</p>

<!-- ① アップロード -->
<div class="card">
  <div class="card-title">① 画像をアップロード</div>
  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="drop-icon">🖼</div>
    <div class="drop-text">タップして画像を選択<br>またはドラッグ＆ドロップ</div>
  </div>
</div>

<!-- ② 設定 -->
<div class="card">
  <div class="card-title">② 操作モードを選択</div>

  <div class="mode-row">
    <button class="mode-btn active" id="mode-pick" onclick="setMode('pick')">🔍 色を取得</button>
    <button class="mode-btn" id="mode-select" onclick="setMode('select')">⬛ 範囲を選択</button>
  </div>

  <div id="canvas-area">
    <div class="canvas-hint" id="canvas-hint">画像をタップして背景色を取得してください</div>
    <div id="main-canvas-wrap">
      <canvas id="main-canvas"></canvas>
      <div id="sel-rect"></div>
      <div id="crosshair"></div>
      <div id="picked-dot"></div>
    </div>
    <div class="range-info" id="range-info"></div>
  </div>

  <div id="sel-actions">
    <button class="sel-btn" id="sel-clear-btn" onclick="clearSelection()">✕ 選択範囲をリセット（全体に適用）</button>
    <button class="sel-btn" id="sel-apply-btn" onclick="applyToSelection()">✓ この範囲だけに背景除去を適用</button>
  </div>

  <div class="color-row">
    <span class="color-label">背景色</span>
    <input type="color" id="bg-color" value="#c0c0c0">
    <div id="color-preview" style="background:#c0c0c0"></div>
    <span id="color-hex">#c0c0c0</span>
  </div>

  <div class="tol-row">
    <span class="color-label" style="white-space:nowrap">許容範囲</span>
    <input type="range" id="tolerance" min="0" max="120" value="35">
    <span id="tolerance-val">35</span>
  </div>

  <button id="run-btn" disabled>✨ 背景を除去する</button>
</div>

<!-- ③ プレビュー -->
<div class="card" id="preview-card" style="display:none">
  <div class="card-title">③ プレビュー</div>
  <div class="preview-row">
    <div class="preview-box" id="before-box">
      <span style="color:var(--muted);font-size:11px">元画像</span>
      <div class="preview-label">BEFORE</div>
    </div>
    <div class="preview-box checker" id="after-box">
      <span style="color:var(--muted);font-size:11px">処理後</span>
      <div class="preview-label">AFTER</div>
    </div>
  </div>
  <div class="card-title" style="margin-top:4px">属性背景で確認</div>
  <div class="elem-row" id="elem-row"></div>
  <div class="preview-box" id="elem-preview" style="aspect-ratio:2/3;margin-bottom:16px;border-radius:12px;overflow:hidden">
    <canvas id="elem-canvas" style="display:block;width:100%;height:100%;object-fit:contain"></canvas>
  </div>
  <button id="dl-btn">⬇ 透過PNGをダウンロード</button>
</div>

<canvas id="work-canvas"></canvas>

<script>
const ELEMENTS=[
  {name:'火',bg:['#2a0800','#6b1a00'],color:'#ef4444'},
  {name:'水',bg:['#001828','#003060'],color:'#38bdf8'},
  {name:'木',bg:['#001a08','#003820'],color:'#4ade80'},
  {name:'土',bg:['#1a1000','#3a2800'],color:'#fbbf24'},
  {name:'風',bg:['#081828','#1a3040'],color:'#a3e635'},
  {name:'金',bg:['#1a0020','#380050'],color:'#f0abfc'},
  {name:'闇',bg:['#080010','#1a0030'],color:'#a78bfa'},
  {name:'光',bg:['#1a1808','#3a3010'],color:'#fde68a'},
];

let origImage=null, resultCanvas=null, selectedElem=0;
let currentMode='pick'; // 'pick' or 'select'
let selStart=null, selEnd=null, selRect=null; // 選択範囲（キャンバス座標）
let isDrawing=false;

// 属性ボタン
const er=document.getElementById('elem-row');
ELEMENTS.forEach((e,i)=>{
  const btn=document.createElement('button');
  btn.className='elem-btn'+(i===0?' active':'');
  btn.style.color=e.color;
  btn.textContent=e.name;
  btn.onclick=()=>{document.querySelectorAll('.elem-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedElem=i;drawElemPreview();};
  er.appendChild(btn);
});

// モード切替
function setMode(m){
  currentMode=m;
  document.getElementById('mode-pick').classList.toggle('active',m==='pick');
  document.getElementById('mode-select').classList.toggle('active',m==='select');
  const wrap=document.getElementById('main-canvas-wrap');
  wrap.classList.toggle('active-mode', origImage!==null);
  if(m==='pick'){
    document.getElementById('canvas-hint').textContent='画像をタップして背景色を取得してください';
    document.getElementById('main-canvas').style.cursor='crosshair';
    document.getElementById('sel-rect').style.display='none';
    document.getElementById('sel-actions').style.display='none';
    document.getElementById('range-info').style.display='none';
  }else{
    document.getElementById('canvas-hint').textContent='除去したい範囲をドラッグして選択してください';
    document.getElementById('main-canvas').style.cursor='cell';
    document.getElementById('crosshair').style.display='none';
    document.getElementById('picked-dot').style.display='none';
  }
}

// ファイル入力
document.getElementById('file-input').addEventListener('change',e=>loadFile(e.target.files[0]));
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');loadFile(e.dataTransfer.files[0]);});
document.getElementById('tolerance').addEventListener('input',e=>document.getElementById('tolerance-val').textContent=e.target.value);
document.getElementById('bg-color').addEventListener('input',e=>setColor(e.target.value));

function setColor(hex){
  document.getElementById('bg-color').value=hex;
  document.getElementById('color-preview').style.background=hex;
  document.getElementById('color-hex').textContent=hex;
}

function loadFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      origImage=img;
      // before preview
      const bb=document.getElementById('before-box');
      bb.innerHTML='';
      const pi=document.createElement('img');pi.src=ev.target.result;pi.style.cssText='width:100%;height:100%;object-fit:contain';
      bb.appendChild(pi);
      const lbl=document.createElement('div');lbl.className='preview-label';lbl.textContent='BEFORE';bb.appendChild(lbl);
      // work canvas
      const wc=document.getElementById('work-canvas');
      wc.width=img.width;wc.height=img.height;
      wc.getContext('2d').drawImage(img,0,0);
      // main canvas（操作用）
      const mc=document.getElementById('main-canvas');
      mc.width=img.width;mc.height=img.height;
      mc.getContext('2d').drawImage(img,0,0);
      // 初期色
      const d=wc.getContext('2d').getImageData(0,0,1,1).data;
      setColor(rgbToHex(d[0],d[1],d[2]));
      // 表示
      document.getElementById('canvas-area').style.display='block';
      document.getElementById('run-btn').disabled=false;
      setupEvents();
      setMode(currentMode);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function setupEvents(){
  const mc=document.getElementById('main-canvas');
  const wrap=document.getElementById('main-canvas-wrap');
  const crosshair=document.getElementById('crosshair');
  const pickedDot=document.getElementById('picked-dot');
  const selRectEl=document.getElementById('sel-rect');

  function getPos(clientX,clientY){
    const rect=mc.getBoundingClientRect();
    const sx=mc.width/rect.width, sy=mc.height/rect.height;
    return {
      px:Math.max(0,Math.min(mc.width-1,Math.floor((clientX-rect.left)*sx))),
      py:Math.max(0,Math.min(mc.height-1,Math.floor((clientY-rect.top)*sy))),
      cx:clientX-rect.left, cy:clientY-rect.top,
      rect
    };
  }

  function pickColor(px,py,cx,cy){
    const d=mc.getContext('2d').getImageData(px,py,1,1).data;
    const hex=rgbToHex(d[0],d[1],d[2]);
    setColor(hex);
    crosshair.style.left=cx+'px';crosshair.style.top=cy+'px';crosshair.style.display='block';
    pickedDot.style.background=hex;pickedDot.style.display='block';
  }

  function updateSelRect(x1,y1,x2,y2){
    const mc=document.getElementById('main-canvas');
    const rect=mc.getBoundingClientRect();
    const sx=rect.width/mc.width, sy=rect.height/mc.height;
    const left=Math.min(x1,x2)*sx, top=Math.min(y1,y2)*sy;
    const w=Math.abs(x2-x1)*sx, h=Math.abs(y2-y1)*sy;
    selRectEl.style.cssText=`display:block;left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;
    // 選択情報表示
    const ri=document.getElementById('range-info');
    ri.style.display='block';
    ri.textContent=`選択範囲: ${Math.min(x1,x2)},${Math.min(y1,y2)} ～ ${Math.max(x1,x2)},${Math.max(y1,y2)} (${Math.abs(x2-x1)}×${Math.abs(y2-y1)}px)`;
    document.getElementById('sel-actions').style.display='flex';
  }

  // タッチ
  mc.addEventListener('touchstart',e=>{
    e.preventDefault();
    const {px,py,cx,cy}=getPos(e.touches[0].clientX,e.touches[0].clientY);
    if(currentMode==='pick'){pickColor(px,py,cx,cy);}
    else{isDrawing=true;selStart={px,py};selEnd={px,py};updateSelRect(px,py,px,py);}
  },{passive:false});
  mc.addEventListener('touchmove',e=>{
    e.preventDefault();
    const {px,py,cx,cy}=getPos(e.touches[0].clientX,e.touches[0].clientY);
    if(currentMode==='pick'){pickColor(px,py,cx,cy);}
    else if(isDrawing){selEnd={px,py};updateSelRect(selStart.px,selStart.py,px,py);}
  },{passive:false});
  mc.addEventListener('touchend',()=>{isDrawing=false;});

  // マウス
  let md=false;
  mc.addEventListener('mousedown',e=>{
    const {px,py,cx,cy}=getPos(e.clientX,e.clientY);
    if(currentMode==='pick'){pickColor(px,py,cx,cy);}
    else{md=true;isDrawing=true;selStart={px,py};selEnd={px,py};updateSelRect(px,py,px,py);}
  });
  mc.addEventListener('mousemove',e=>{
    const {px,py,cx,cy}=getPos(e.clientX,e.clientY);
    if(currentMode==='pick'&&e.buttons===1){pickColor(px,py,cx,cy);}
    else if(currentMode==='select'&&isDrawing&&md){selEnd={px,py};updateSelRect(selStart.px,selStart.py,px,py);}
  });
  mc.addEventListener('mouseup',()=>{md=false;isDrawing=false;});
  mc.addEventListener('mouseleave',()=>{
    if(currentMode==='pick'){crosshair.style.display='none';}
  });
}

function clearSelection(){
  selStart=null;selEnd=null;
  document.getElementById('sel-rect').style.display='none';
  document.getElementById('sel-actions').style.display='none';
  document.getElementById('range-info').style.display='none';
}

function applyToSelection(){
  // 選択範囲に除去を適用
  runRemoval(true);
}

// 背景除去
document.getElementById('run-btn').addEventListener('click',()=>runRemoval(false));

function runRemoval(selectionOnly){
  if(!origImage)return;
  const bg=hexToRgb(document.getElementById('bg-color').value);
  const tol=parseInt(document.getElementById('tolerance').value);
  const wc=document.getElementById('work-canvas');

  // 前回の結果があればそれをベースに重ね掛け、なければ元画像から
  const base=resultCanvas||origImage;
  wc.width=origImage.width;wc.height=origImage.height;
  const ctx=wc.getContext('2d');
  ctx.drawImage(base,0,0);

  const imgData=ctx.getImageData(0,0,wc.width,wc.height);
  const data=imgData.data;

  // 処理範囲の決定
  let x0=0,y0=0,x1=wc.width,y1=wc.height;
  if(selectionOnly&&selStart&&selEnd){
    x0=Math.min(selStart.px,selEnd.px);
    y0=Math.min(selStart.py,selEnd.py);
    x1=Math.max(selStart.px,selEnd.px);
    y1=Math.max(selStart.py,selEnd.py);
  }

  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      const i=(y*wc.width+x)*4;
      const dist=colorDist(data[i],data[i+1],data[i+2],bg.r,bg.g,bg.b);
      if(dist<=tol){
        data[i+3]=Math.max(0,Math.min(255,Math.round((dist/tol)*255*0.5)));
      }
    }
  }
  ctx.putImageData(imgData,0,0);

  resultCanvas=document.createElement('canvas');
  resultCanvas.width=wc.width;resultCanvas.height=wc.height;
  resultCanvas.getContext('2d').putImageData(imgData,0,0);

  // main canvasも更新（除去後の状態を反映）
  const mc=document.getElementById('main-canvas');
  mc.getContext('2d').putImageData(imgData,0,0);
  // 除去後は選択矩形を再描画
  if(selStart&&selEnd)updateSelRectOnMain();

  // after preview
  const ab=document.getElementById('after-box');
  ab.innerHTML='';
  ab.className='preview-box checker';
  const ai=document.createElement('img');
  ai.src=resultCanvas.toDataURL('image/png');
  ai.style.cssText='width:100%;height:100%;object-fit:contain;z-index:1;position:relative';
  ab.appendChild(ai);
  const lbl2=document.createElement('div');lbl2.className='preview-label';lbl2.textContent='AFTER';ab.appendChild(lbl2);

  document.getElementById('preview-card').style.display='block';
  document.getElementById('dl-btn').style.display='block';
  drawElemPreview();
  document.getElementById('preview-card').scrollIntoView({behavior:'smooth'});
}

function updateSelRectOnMain(){
  if(!selStart||!selEnd)return;
  const mc=document.getElementById('main-canvas');
  const rect=mc.getBoundingClientRect();
  const sx=rect.width/mc.width,sy=rect.height/mc.height;
  const sr=document.getElementById('sel-rect');
  const left=Math.min(selStart.px,selEnd.px)*sx,top=Math.min(selStart.py,selEnd.py)*sy;
  const w=Math.abs(selEnd.px-selStart.px)*sx,h=Math.abs(selEnd.py-selStart.py)*sy;
  sr.style.cssText=`display:block;left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;
}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};}
function colorDist(r1,g1,b1,r2,g2,b2){return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}

function drawElemPreview(){
  if(!resultCanvas)return;
  const e=ELEMENTS[selectedElem];
  const ec=document.getElementById('elem-canvas');
  const ratio=resultCanvas.width/resultCanvas.height;
  ec.width=300;ec.height=Math.round(300/ratio);
  const ctx=ec.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,ec.width,ec.height);
  grad.addColorStop(0,e.bg[0]);grad.addColorStop(1,e.bg[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,ec.width,ec.height);
  ctx.drawImage(resultCanvas,0,0,ec.width,ec.height);
}

document.getElementById('dl-btn').addEventListener('click',()=>{
  if(!resultCanvas)return;
  const a=document.createElement('a');
  a.download='character_transparent.png';
  a.href=resultCanvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
