<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>背景除去ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
  :root{--bg:#0a0a0f;--surface:#13131a;--border:#2a2a3a;--gold:#c9a84c;--text:#e8e4d8;--muted:#666680;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  h1{font-size:20px;font-weight:900;letter-spacing:4px;color:var(--gold);margin-bottom:4px;}
  .subtitle{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:24px;text-transform:uppercase;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:480px;margin-bottom:14px;}
  .card-title{font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:14px;text-transform:uppercase;}
  #drop-zone{border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
  #drop-zone:hover,#drop-zone.dragover{border-color:var(--gold);background:rgba(201,168,76,.05);}
  #drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .drop-icon{font-size:36px;margin-bottom:10px;}
  .drop-text{font-size:12px;color:var(--muted);line-height:1.8;}

  /* モード */
  .mode-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:80px;padding:8px 4px;border-radius:8px;font-size:10px;font-family:'Noto Serif JP',serif;letter-spacing:.5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;}
  .mode-btn.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold);}

  /* キャンバスビューポート（ズーム・パン用） */
  #canvas-area{display:none;margin-bottom:14px;}
  .canvas-hint{font-size:10px;color:var(--muted);background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:8px 12px;margin-bottom:10px;line-height:1.7;}
  #viewport{width:100%;aspect-ratio:3/4;background:#111;border-radius:12px;border:2px solid rgba(201,168,76,.3);overflow:hidden;position:relative;touch-action:none;}
  #viewport.active-mode{border-color:var(--gold);}
  #inner{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
  #main-canvas{display:block;touch-action:none;user-select:none;image-rendering:pixelated;}
  #sel-overlay{position:absolute;top:0;left:0;pointer-events:none;image-rendering:pixelated;}

  /* 選択アクション */
  #sel-actions{display:none;gap:6px;margin-bottom:12px;flex-direction:column;}
  .sel-btn{padding:9px;border-radius:8px;font-size:11px;font-family:'Noto Serif JP',serif;letter-spacing:1px;cursor:pointer;border:1px solid;transition:all .15s;width:100%;}
  #sel-clear-btn{border-color:var(--border);background:transparent;color:var(--muted);}
  #sel-apply-btn{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.12);color:var(--gold);}

  .color-row{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
  .color-label{font-size:11px;color:var(--muted);letter-spacing:1px;white-space:nowrap;}
  #bg-color{width:38px;height:38px;border:2px solid var(--border);border-radius:8px;cursor:pointer;background:none;padding:2px;flex-shrink:0;}
  #color-preview{flex:1;height:30px;border-radius:8px;border:1px solid var(--border);background:#c0c0c0;transition:background .15s;}
  #color-hex{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-width:56px;}
  .tol-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  #tolerance{flex:1;accent-color:var(--gold);}
  #tolerance-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);min-width:26px;text-align:right;}

  #run-btn{width:100%;padding:13px;background:linear-gradient(135deg,#c9a84c,#e8c97a);border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:'Noto Serif JP',serif;color:#0a0a0f;cursor:pointer;letter-spacing:3px;transition:opacity .15s;}
  #run-btn:hover{opacity:.85;}
  #run-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* プレビュー */
  .preview-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .preview-box{border-radius:10px;overflow:hidden;border:1px solid var(--border);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;position:relative;}
  .checker{background-image:linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;background-color:#111;}
  .preview-label{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:var(--muted);background:rgba(0,0,0,.7);padding:2px 8px;border-radius:4px;white-space:nowrap;}
  .preview-box img{width:100%;height:100%;object-fit:contain;}
  .elem-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
  .elem-btn{padding:4px 9px;border-radius:6px;font-size:10px;cursor:pointer;border:1px solid transparent;font-family:'Noto Serif JP',serif;transition:all .15s;opacity:.6;background:transparent;}
  .elem-btn.active{opacity:1;border-color:currentColor;}
  #dl-btn{width:100%;padding:11px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);border-radius:10px;font-size:12px;font-weight:700;font-family:'Noto Serif JP',serif;color:var(--gold);cursor:pointer;letter-spacing:2px;transition:all .15s;display:none;}
  #dl-btn:hover{background:rgba(201,168,76,.2);}
  canvas#work-canvas{display:none;}
  .zoom-info{text-align:center;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:6px;}
</style>
</head>
<body>
<h1>⚗ 背景除去</h1>
<p class="subtitle">単色背景 → 透過PNG変換ツール</p>

<div class="card">
  <div class="card-title">① 画像をアップロード</div>
  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="drop-icon">🖼</div>
    <div class="drop-text">タップして画像を選択<br>またはドラッグ＆ドロップ</div>
  </div>
</div>

<div class="card">
  <div class="card-title">② 操作モードを選択</div>
  <div class="mode-row">
    <button class="mode-btn active" id="mode-pick" onclick="setMode('pick')">🔍 色取得</button>
    <button class="mode-btn" id="mode-rect" onclick="setMode('rect')">⬛ 矩形選択</button>
    <button class="mode-btn" id="mode-lasso" onclick="setMode('lasso')">✏️ なぞり選択</button>
    <button class="mode-btn" id="mode-pan" onclick="setMode('pan')">✋ 移動・拡大</button>
  </div>

  <div id="canvas-area">
    <div class="canvas-hint" id="canvas-hint">画像をタップして背景色を取得</div>
    <div id="viewport">
      <div id="inner">
        <canvas id="main-canvas"></canvas>
        <canvas id="sel-overlay"></canvas>
      </div>
    </div>
    <div class="zoom-info" id="zoom-info">2本指でピンチ拡大 / 1本指でパン（移動モード時）</div>
  </div>

  <div id="sel-actions">
    <button class="sel-btn" id="sel-clear-btn" onclick="clearSelection()">✕ 選択解除</button>
    <button class="sel-btn" id="sel-apply-btn" onclick="runRemoval(true)">✓ 選択範囲のみ除去</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:12px">
    <button class="sel-btn" id="undo-btn" onclick="doUndo()" style="border-color:rgba(100,120,255,.4);background:rgba(100,120,255,.1);color:#818cf8;display:none">↩ 1つ戻す</button>
    <button class="sel-btn" id="lasso-add-btn" onclick="startLassoAdd()" style="border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.08);color:#FFD700;display:none">✏️ なぞりを追加</button>
  </div>

  <div class="color-row">
    <span class="color-label">背景色</span>
    <input type="color" id="bg-color" value="#c0c0c0">
    <div id="color-preview" style="background:#c0c0c0"></div>
    <span id="color-hex">#c0c0c0</span>
  </div>
  <div class="tol-row">
    <span class="color-label" style="white-space:nowrap">許容範囲</span>
    <input type="range" id="tolerance" min="0" max="120" value="35">
    <span id="tolerance-val">35</span>
  </div>
  <button id="run-btn" disabled>✨ 背景を除去する（全体）</button>
</div>

<div class="card" id="preview-card" style="display:none">
  <div class="card-title">③ プレビュー</div>
  <div class="preview-row">
    <div class="preview-box" id="before-box"><span style="color:var(--muted);font-size:11px">元画像</span><div class="preview-label">BEFORE</div></div>
    <div class="preview-box checker" id="after-box"><span style="color:var(--muted);font-size:11px">処理後</span><div class="preview-label">AFTER</div></div>
  </div>
  <div class="card-title" style="margin-top:4px">属性背景で確認</div>
  <div class="elem-row" id="elem-row"></div>
  <div class="preview-box" id="elem-preview" style="aspect-ratio:2/3;margin-bottom:14px;border-radius:12px;overflow:hidden">
    <canvas id="elem-canvas" style="display:block;width:100%;height:100%;object-fit:contain"></canvas>
  </div>
  <button id="dl-btn">⬇ 透過PNGをダウンロード</button>
</div>
<canvas id="work-canvas"></canvas>

<script>
const ELEMENTS=[
  {name:'火',bg:['#2a0800','#6b1a00'],color:'#ef4444'},
  {name:'水',bg:['#001828','#003060'],color:'#38bdf8'},
  {name:'木',bg:['#001a08','#003820'],color:'#4ade80'},
  {name:'土',bg:['#1a1000','#3a2800'],color:'#fbbf24'},
  {name:'風',bg:['#081828','#1a3040'],color:'#a3e635'},
  {name:'金',bg:['#1a0020','#380050'],color:'#f0abfc'},
  {name:'闇',bg:['#080010','#1a0030'],color:'#a78bfa'},
  {name:'光',bg:['#1a1808','#3a3010'],color:'#fde68a'},
];

let origImage=null, resultCanvas=null, selectedElem=0;
let currentMode='pick';

// ズーム・パン状態
let scale=1, panX=0, panY=0;
let lastPinchDist=null, lastPanPos=null;

// 矩形選択
let rectSel=null; // {x0,y0,x1,y1} キャンバス座標
let rectDragging=null; // null|'new'|'tl'|'tr'|'bl'|'br'|'move'
let rectDragStart=null;
let rectSelStart=null;

// なぞり選択
let lassoPoints=[];       // 確定済みの点列
let lassoDrawing=false;   // 描画中フラグ
let lassoAddMode=false;   // 追加モード（指離した後の追加なぞり）

// Undo履歴
let undoHistory=[];  // {imageData, rect, lasso}のスタック
const MAX_UNDO=10;

// 属性ボタン
const er=document.getElementById('elem-row');
ELEMENTS.forEach((e,i)=>{
  const btn=document.createElement('button');
  btn.className='elem-btn'+(i===0?' active':'');
  btn.style.color=e.color;btn.textContent=e.name;
  btn.onclick=()=>{document.querySelectorAll('.elem-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedElem=i;drawElemPreview();};
  er.appendChild(btn);
});

// ファイル入力
document.getElementById('file-input').addEventListener('change',e=>loadFile(e.target.files[0]));
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');loadFile(e.dataTransfer.files[0]);});
document.getElementById('tolerance').addEventListener('input',e=>document.getElementById('tolerance-val').textContent=e.target.value);
document.getElementById('bg-color').addEventListener('input',e=>setColor(e.target.value));

function setColor(hex){
  document.getElementById('bg-color').value=hex;
  document.getElementById('color-preview').style.background=hex;
  document.getElementById('color-hex').textContent=hex;
}

function setMode(m){
  currentMode=m;
  ['pick','rect','lasso','pan'].forEach(n=>document.getElementById('mode-'+n).classList.toggle('active',n===m));
  const hints={
    pick:'タップ（またはドラッグ）して背景色を取得',
    rect:'ドラッグで矩形選択。角・辺をドラッグして微調整できます',
    lasso:'指でなぞった輪郭内を選択（始点に戻ると確定）',
    pan:'1本指でパン・2本指でピンチ拡大縮小'
  };
  document.getElementById('canvas-hint').textContent=hints[m];
  const vp=document.getElementById('viewport');
  vp.classList.toggle('active-mode',m!=='pan');
}

function loadFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      origImage=img;
      // before preview
      const bb=document.getElementById('before-box');bb.innerHTML='';
      const pi=document.createElement('img');pi.src=ev.target.result;pi.style.cssText='width:100%;height:100%;object-fit:contain';bb.appendChild(pi);
      const lbl=document.createElement('div');lbl.className='preview-label';lbl.textContent='BEFORE';bb.appendChild(lbl);
      // canvases
      const mc=document.getElementById('main-canvas');
      mc.width=img.width;mc.height=img.height;
      mc.getContext('2d').drawImage(img,0,0);
      const so=document.getElementById('sel-overlay');
      so.width=img.width;so.height=img.height;
      // work canvas
      const wc=document.getElementById('work-canvas');
      wc.width=img.width;wc.height=img.height;
      wc.getContext('2d').drawImage(img,0,0);
      // 初期色
      const d=wc.getContext('2d').getImageData(0,0,1,1).data;
      setColor(rgbToHex(d[0],d[1],d[2]));
      // ビューポートにフィット（描画後に実行）
      document.getElementById('canvas-area').style.display='block';
      requestAnimationFrame(()=>requestAnimationFrame(fitToViewport));
      document.getElementById('run-btn').disabled=false;
      setupEvents();
      setMode('pick');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function fitToViewport(){
  const vp=document.getElementById('viewport');
  const vpW=vp.offsetWidth, vpH=vp.offsetHeight;
  if(!vpW||!vpH)return;
  const mc=document.getElementById('main-canvas');
  scale=Math.min(vpW/mc.width, vpH/mc.height)*0.95;
  panX=(vpW-mc.width*scale)/2;
  panY=(vpH-mc.height*scale)/2;
  applyTransform();
}

function applyTransform(){
  document.getElementById('inner').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
}

// キャンバス座標変換
function vpToCanvas(clientX, clientY){
  const vp=document.getElementById('viewport');
  const rect=vp.getBoundingClientRect();
  return {
    x:(clientX-rect.left-panX)/scale,
    y:(clientY-rect.top-panY)/scale
  };
}

// ハンドル判定（矩形の角・移動）
function getHandleAt(x,y){
  if(!rectSel)return null;
  const {x0,y0,x1,y1}=rectSel;
  const cx=Math.min(x0,x1),cy=Math.min(y0,y1),cw=Math.abs(x1-x0),ch=Math.abs(y1-y0);
  const HIT=12/scale;
  const corners=[
    {id:'tl',hx:cx,hy:cy},{id:'tr',hx:cx+cw,hy:cy},
    {id:'bl',hx:cx,hy:cy+ch},{id:'br',hx:cx+cw,hy:cy+ch}
  ];
  for(const c of corners){
    if(Math.abs(x-c.hx)<HIT&&Math.abs(y-c.hy)<HIT)return c.id;
  }
  // 辺
  if(x>cx-HIT&&x<cx+cw+HIT&&y>cy-HIT&&y<cy+ch+HIT)return 'move';
  return null;
}

function clampCanvas(v,max){return Math.max(0,Math.min(max,v));}

function setupEvents(){
  const vp=document.getElementById('viewport');

  // ======= タッチ =======
  vp.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      // ピンチ開始
      lastPinchDist=pinchDist(e.touches);
      lastPanPos=pinchCenter(e.touches);
      e.preventDefault();return;
    }
    if(e.touches.length===1){
      const t=e.touches[0];
      const pos=vpToCanvas(t.clientX,t.clientY);
      handleStart(pos,t.clientX,t.clientY);
      e.preventDefault();
    }
  },{passive:false});

  vp.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      // ピンチ
      const dist=pinchDist(e.touches);
      const center=pinchCenter(e.touches);
      if(lastPinchDist){
        const ds=dist/lastPinchDist;
        const vr=vp.getBoundingClientRect();
        const cx=center.x-vr.left, cy=center.y-vr.top;
        panX=(panX-cx)*ds+cx;
        panY=(panY-cy)*ds+cy;
        scale*=ds;
        applyTransform();
      }
      // パンも（2本指スワイプ）
      if(lastPanPos){
        panX+=center.x-lastPanPos.x;
        panY+=center.y-lastPanPos.y;
        applyTransform();
      }
      lastPinchDist=dist;lastPanPos=center;
      e.preventDefault();return;
    }
    if(e.touches.length===1){
      const t=e.touches[0];
      const pos=vpToCanvas(t.clientX,t.clientY);
      handleMove(pos,t.clientX,t.clientY);
      e.preventDefault();
    }
  },{passive:false});

  vp.addEventListener('touchend',e=>{
    lastPinchDist=null;lastPanPos=null;
    handleEnd();
    e.preventDefault();
  },{passive:false});

  // ======= マウス =======
  let md=false;
  vp.addEventListener('mousedown',e=>{
    md=true;
    const pos=vpToCanvas(e.clientX,e.clientY);
    handleStart(pos,e.clientX,e.clientY);
  });
  vp.addEventListener('mousemove',e=>{
    if(!md)return;
    const pos=vpToCanvas(e.clientX,e.clientY);
    handleMove(pos,e.clientX,e.clientY);
  });
  vp.addEventListener('mouseup',()=>{md=false;handleEnd();});
  vp.addEventListener('mouseleave',()=>{if(md){md=false;handleEnd();}});
  // ホイールズーム
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const vr=vp.getBoundingClientRect();
    const cx=e.clientX-vr.left, cy=e.clientY-vr.top;
    const ds=e.deltaY<0?1.1:0.9;
    panX=(panX-cx)*ds+cx;panY=(panY-cy)*ds+cy;scale*=ds;
    applyTransform();
  },{passive:false});
}

// ======= ハンドラ =======
function handleStart(pos,clientX,clientY){
  const mc=document.getElementById('main-canvas');
  const px=clampCanvas(Math.floor(pos.x),mc.width-1);
  const py=clampCanvas(Math.floor(pos.y),mc.height-1);

  if(currentMode==='pan'){
    lastPanPos={x:clientX,y:clientY};
    return;
  }
  if(currentMode==='pick'){
    const d=mc.getContext('2d').getImageData(px,py,1,1).data;
    setColor(rgbToHex(d[0],d[1],d[2]));
    return;
  }
  if(currentMode==='rect'){
    const h=getHandleAt(pos.x,pos.y);
    if(h){
      // 既存矩形の操作
      rectDragging=h;
      rectDragStart={x:pos.x,y:pos.y,sel:{...rectSel}};
    }else{
      // 新規矩形
      rectDragging='new';
      rectSelStart={x:pos.x,y:pos.y};
      rectSel={x0:pos.x,y0:pos.y,x1:pos.x,y1:pos.y};
    }
    return;
  }
  if(currentMode==='lasso'){
    if(lassoAddMode){
      // 追加なぞり：既存のlassoPointsに追加
      lassoDrawing=true;
      lassoAddMode=false;
      // 最も近い点の近くから追加開始
      lassoPoints.push({x:pos.x,y:pos.y});
    }else{
      // 新規なぞり
      lassoDrawing=true;
      lassoPoints=[{x:pos.x,y:pos.y}];
    }
    drawSelOverlay();return;
  }
}

function handleMove(pos,clientX,clientY){
  const mc=document.getElementById('main-canvas');
  const px=clampCanvas(Math.floor(pos.x),mc.width-1);
  const py=clampCanvas(Math.floor(pos.y),mc.height-1);

  if(currentMode==='pan'&&lastPanPos){
    panX+=clientX-lastPanPos.x;panY+=clientY-lastPanPos.y;
    lastPanPos={x:clientX,y:clientY};
    applyTransform();return;
  }
  if(currentMode==='pick'){
    const d=mc.getContext('2d').getImageData(px,py,1,1).data;
    setColor(rgbToHex(d[0],d[1],d[2]));return;
  }
  if(currentMode==='rect'&&rectDragging){
    if(rectDragging==='new'){
      rectSel={x0:rectSelStart.x,y0:rectSelStart.y,x1:pos.x,y1:pos.y};
    }else if(rectDragging==='move'){
      const dx=pos.x-rectDragStart.x, dy=pos.y-rectDragStart.y;
      const s=rectDragStart.sel;
      rectSel={x0:s.x0+dx,y0:s.y0+dy,x1:s.x1+dx,y1:s.y1+dy};
    }else{
      // 角ドラッグ
      const s=rectDragStart.sel;
      const opp={tl:{x:s.x1,y:s.y1},tr:{x:s.x0,y:s.y1},bl:{x:s.x1,y:s.y0},br:{x:s.x0,y:s.y0}};
      const o=opp[rectDragging];
      rectSel={x0:o.x,y0:o.y,x1:pos.x,y1:pos.y};
    }
    drawSelOverlay();return;
  }
  if(currentMode==='lasso'&&lassoDrawing){
    lassoPoints.push({x:pos.x,y:pos.y});
    drawSelOverlay();return;
  }
}

function handleEnd(){
  if(currentMode==='pan'){lastPanPos=null;return;}
  if(currentMode==='rect'&&rectDragging){
    rectDragging=null;rectDragStart=null;rectSelStart=null;
    if(rectSel&&Math.abs(rectSel.x1-rectSel.x0)>4&&Math.abs(rectSel.y1-rectSel.y0)>4){
      document.getElementById('sel-actions').style.display='flex';
    }
    drawSelOverlay();return;
  }
  if(currentMode==='lasso'&&lassoDrawing){
    lassoDrawing=false;
    if(lassoPoints.length>5){
      document.getElementById('sel-actions').style.display='flex';
      document.getElementById('lasso-add-btn').style.display='block';
    }else{lassoPoints=[];}
    drawSelOverlay();return;
  }
}

function drawSelOverlay(){
  const so=document.getElementById('sel-overlay');
  const ctx=so.getContext('2d');
  ctx.clearRect(0,0,so.width,so.height);

  if(currentMode==='rect'&&rectSel){
    const {x0,y0,x1,y1}=rectSel;
    const lx=Math.min(x0,x1),ly=Math.min(y0,y1),lw=Math.abs(x1-x0),lh=Math.abs(y1-y0);
    // 暗幕（選択外）
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,so.width,so.height);
    ctx.clearRect(lx,ly,lw,lh);
    // 点線枠
    ctx.setLineDash([6,4]);ctx.strokeStyle='#FFD700';ctx.lineWidth=2;
    ctx.strokeRect(lx,ly,lw,lh);ctx.setLineDash([]);
    // ハンドル
    const corners=[{x:lx,y:ly},{x:lx+lw,y:ly},{x:lx,y:ly+lh},{x:lx+lw,y:ly+lh}];
    ctx.fillStyle='#FFD700';
    corners.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,6,0,Math.PI*2);ctx.fill();});
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    corners.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,6,0,Math.PI*2);ctx.stroke();});
  }

  if(currentMode==='lasso'&&lassoPoints.length>1){
    // パスを作る
    ctx.beginPath();
    ctx.moveTo(lassoPoints[0].x,lassoPoints[0].y);
    lassoPoints.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.closePath();
    // 暗幕（選択外）
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,so.width,so.height);
    ctx.globalCompositeOperation='destination-out';
    ctx.fill();
    ctx.restore();
    // 枠線
    ctx.setLineDash([6,4]);ctx.strokeStyle='#FFD700';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(lassoPoints[0].x,lassoPoints[0].y);
    lassoPoints.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    // 始点マーカー
    ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(lassoPoints[0].x,lassoPoints[0].y,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lassoPoints[0].x,lassoPoints[0].y,3,0,Math.PI*2);ctx.fill();
    // 描画中なら最後の点にもマーカー
    if(lassoDrawing&&lassoPoints.length>1){
      const last=lassoPoints[lassoPoints.length-1];
      ctx.fillStyle='rgba(255,215,0,.6)';ctx.beginPath();ctx.arc(last.x,last.y,4,0,Math.PI*2);ctx.fill();
    }
  }
}

function clearSelection(){
  rectSel=null;lassoPoints=[];lassoAddMode=false;lassoDrawing=false;
  const so=document.getElementById('sel-overlay');
  so.getContext('2d').clearRect(0,0,so.width,so.height);
  document.getElementById('sel-actions').style.display='none';
  document.getElementById('lasso-add-btn').style.display='none';
}

function startLassoAdd(){
  lassoAddMode=true;
  document.getElementById('canvas-hint').textContent='追加でなぞって選択範囲を修正してください';
}

// 背景除去
document.getElementById('run-btn').addEventListener('click',()=>runRemoval(false));

function doUndo(){
  if(undoHistory.length===0)return;
  const prev=undoHistory.pop();
  resultCanvas=prev;
  // main canvasに戻す
  const mc=document.getElementById('main-canvas');
  mc.getContext('2d').drawImage(prev,0,0);
  // after previewも更新
  const ab=document.getElementById('after-box');
  if(ab.querySelector('img'))ab.querySelector('img').src=prev.toDataURL('image/png');
  drawElemPreview();
  if(undoHistory.length===0)document.getElementById('undo-btn').style.display='none';
}

function saveUndo(){
  if(!resultCanvas)return;
  const copy=document.createElement('canvas');
  copy.width=resultCanvas.width;copy.height=resultCanvas.height;
  copy.getContext('2d').drawImage(resultCanvas,0,0);
  undoHistory.push(copy);
  if(undoHistory.length>MAX_UNDO)undoHistory.shift();
  document.getElementById('undo-btn').style.display='block';
}

function runRemoval(selOnly){
  if(!origImage)return;
  // Undo用に現状を保存
  if(resultCanvas)saveUndo();
  const bg=hexToRgb(document.getElementById('bg-color').value);
  const tol=parseInt(document.getElementById('tolerance').value);
  const wc=document.getElementById('work-canvas');
  const base=resultCanvas||origImage;
  wc.width=origImage.width;wc.height=origImage.height;
  const ctx=wc.getContext('2d');
  ctx.drawImage(base,0,0);
  const imgData=ctx.getImageData(0,0,wc.width,wc.height);
  const data=imgData.data;

  // マスク作成
  let mask=null;
  if(selOnly){
    mask=new Uint8Array(wc.width*wc.height);
    if(currentMode==='rect'&&rectSel){
      const lx=Math.round(Math.min(rectSel.x0,rectSel.x1));
      const ly=Math.round(Math.min(rectSel.y0,rectSel.y1));
      const lx2=Math.round(Math.max(rectSel.x0,rectSel.x1));
      const ly2=Math.round(Math.max(rectSel.y0,rectSel.y1));
      for(let y=ly;y<ly2;y++)for(let x=lx;x<lx2;x++)if(y>=0&&y<wc.height&&x>=0&&x<wc.width)mask[y*wc.width+x]=1;
    }else if(currentMode==='lasso'&&lassoPoints.length>2){
      // ポリゴン内判定（Ray casting）
      for(let y=0;y<wc.height;y++){
        for(let x=0;x<wc.width;x++){
          if(pointInPoly(x,y,lassoPoints))mask[y*wc.width+x]=1;
        }
      }
    }
  }

  for(let i=0;i<data.length;i+=4){
    const idx=i/4;
    if(mask&&!mask[idx])continue;
    const dist=colorDist(data[i],data[i+1],data[i+2],bg.r,bg.g,bg.b);
    if(dist<=tol)data[i+3]=Math.max(0,Math.min(255,Math.round((dist/tol)*255*0.5)));
  }
  ctx.putImageData(imgData,0,0);

  resultCanvas=document.createElement('canvas');
  resultCanvas.width=wc.width;resultCanvas.height=wc.height;
  resultCanvas.getContext('2d').putImageData(imgData,0,0);

  // main canvasに反映
  document.getElementById('main-canvas').getContext('2d').putImageData(imgData,0,0);
  clearSelection();

  // after preview
  const ab=document.getElementById('after-box');
  ab.innerHTML='';ab.className='preview-box checker';
  const ai=document.createElement('img');
  ai.src=resultCanvas.toDataURL('image/png');
  ai.style.cssText='width:100%;height:100%;object-fit:contain;z-index:1;position:relative';
  ab.appendChild(ai);
  const lbl=document.createElement('div');lbl.className='preview-label';lbl.textContent='AFTER';ab.appendChild(lbl);

  document.getElementById('preview-card').style.display='block';
  document.getElementById('dl-btn').style.display='block';
  drawElemPreview();
  document.getElementById('preview-card').scrollIntoView({behavior:'smooth'});
}

function pointInPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

function pinchDist(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function pinchCenter(touches){
  return{x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2};
}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};}
function colorDist(r1,g1,b1,r2,g2,b2){return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}

function drawElemPreview(){
  if(!resultCanvas)return;
  const e=ELEMENTS[selectedElem];
  const ec=document.getElementById('elem-canvas');
  const ratio=resultCanvas.width/resultCanvas.height;
  ec.width=300;ec.height=Math.round(300/ratio);
  const ctx=ec.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,ec.width,ec.height);
  grad.addColorStop(0,e.bg[0]);grad.addColorStop(1,e.bg[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,ec.width,ec.height);
  ctx.drawImage(resultCanvas,0,0,ec.width,ec.height);
}

document.getElementById('dl-btn').addEventListener('click',()=>{
  if(!resultCanvas)return;
  const a=document.createElement('a');
  a.download='character_transparent.png';
  a.href=resultCanvas.toDataURL('image/png');
  a.click();
});
</script>
